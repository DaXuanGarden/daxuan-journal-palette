<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Daxuan Journal Palette 快速使用流程</title>
  <desc id="desc">从图表需求到快速路由、作者确认、代码输出与可读性审查的四步流程图。</desc>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="72" y="72" fill="#263746" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">Daxuan Journal Palette</text>
  <text x="72" y="108" fill="#667680" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">先语义，后气质；先可读，后装饰</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <rect x="64" y="164" width="244" height="278" rx="12" fill="#e8f0ef" stroke="#9ebbb6" stroke-width="2"/>
    <circle cx="102" cy="207" r="23" fill="#427c7c"/>
    <text x="102" y="215" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">1</text>
    <text x="142" y="214" fill="#263746" font-size="21" font-weight="700">描述需求</text>
    <text x="88" y="270" fill="#38515c" font-size="17">图表类型</text>
    <text x="88" y="306" fill="#38515c" font-size="17">组数 / 类别数</text>
    <text x="88" y="342" fill="#38515c" font-size="17">白底或深底</text>
    <text x="88" y="397" fill="#667680" font-size="15">其余信息自动推断</text>

    <rect x="340" y="164" width="244" height="278" rx="12" fill="#edf1f4" stroke="#a9bbc5" stroke-width="2"/>
    <circle cx="378" cy="207" r="23" fill="#466b83"/>
    <text x="378" y="215" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">2</text>
    <text x="418" y="214" fill="#263746" font-size="21" font-weight="700">快速路由</text>
    <text x="364" y="270" fill="#38515c" font-size="17">关键词 → 色板 ID</text>
    <text x="364" y="306" fill="#38515c" font-size="17">主方案 × 1</text>
    <text x="364" y="342" fill="#38515c" font-size="17">备选方案 ≤ 2</text>
    <text x="364" y="397" fill="#667680" font-size="15">同时提示适用图表与风险</text>

    <rect x="616" y="164" width="244" height="278" rx="12" fill="#f5ede0" stroke="#d6b983" stroke-width="2"/>
    <circle cx="654" cy="207" r="23" fill="#b4833e"/>
    <text x="654" y="215" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">3</text>
    <text x="694" y="214" fill="#263746" font-size="21" font-weight="700">作者确认</text>
    <text x="640" y="270" fill="#5b4c39" font-size="17">默认：内置配方</text>
    <text x="640" y="306" fill="#5b4c39" font-size="17">说“抽卡”：5 张</text>
    <text x="640" y="342" fill="#5b4c39" font-size="17">说“一张”：1 张</text>
    <text x="640" y="397" fill="#76624a" font-size="15">先选图，再提色和映射</text>

    <rect x="892" y="164" width="244" height="278" rx="12" fill="#f2e8eb" stroke="#cda4ae" stroke-width="2"/>
    <circle cx="930" cy="207" r="23" fill="#a75f70"/>
    <text x="930" y="215" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">4</text>
    <text x="970" y="214" fill="#263746" font-size="21" font-weight="700">交付与审查</text>
    <text x="916" y="270" fill="#5d4350" font-size="17">HEX + R / Python</text>
    <text x="916" y="306" fill="#5d4350" font-size="17">色盲 / 灰度 / 印刷</text>
    <text x="916" y="342" fill="#5d4350" font-size="17">多面板语义固定</text>
    <text x="916" y="397" fill="#765b65" font-size="15">来源和算法写入 provenance</text>
  </g>

  <g fill="none" stroke="#87969d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 303h22"/><path d="M324 294l10 9-10 9"/>
    <path d="M586 303h22"/><path d="M600 294l10 9-10 9"/>
    <path d="M862 303h22"/><path d="M876 294l10 9-10 9"/>
  </g>
  <rect x="64" y="502" width="1072" height="62" rx="10" fill="#263746"/>
  <text x="600" y="541" text-anchor="middle" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18">速度来自轻量索引，质量来自语义映射与最终尺寸审查</text>
</svg>
