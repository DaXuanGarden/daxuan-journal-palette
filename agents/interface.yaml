interface:
  display_name: "Daxuan Journal Palette"
  short_description: "Design and audit artistic, publication-ready palettes for scientific figures"
  default_prompt: "快速为这张科研图选择 1 套主配色和最多 2 套备选；先根据图表类型、组数和白底/深底匹配内置风格。只有在我明确要求抽卡或图片提色时，才抽 1 或 5 张公共领域/生成式卡片，再输出来源、语义映射、HEX、R/ggplot2 和 Python 代码，并检查色盲、灰度、印刷、最终尺寸和多面板一致性。"
compatibility:
  canonical_format: "Daxuan Skill Markdown with references and deterministic trigger cases"
  adapter_targets:
    - openai
    - claude
    - generic
    - agent-skills-compatible
  activation:
    mode: "description-first"
    language: ["zh-CN", "en"]
  execution:
    deterministic_scripts: false
    optional_tools: ["easyplot palette audit", "imagegen", "Pillow for local image extraction"]
  trust:
    source_boundary: "Recommendations are design guidance; automatic checks are diagnostic evidence."
    human_review_required: true
  permissions:
    filesystem: "read-only by default; write only when the user requests a palette file or figure edit"
    network: "not required by the built-in atlas; required only for open-public card draws"
  degradation:
    missing_geometry: "state assumptions and provide a palette plus a review checklist"
    missing_audit_tool: "provide manual checks and label automated evidence as unavailable"
gates:
  - semantic_mapping
  - accessibility_diagnostic
  - cross_panel_consistency
  - evidence_boundary
